name: Extract discord-auth-bot ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP and move contents to root
        run: |
          unzip -o discord-auth-bot.zip -d .
          rm -f discord-auth-bot.zip

          shopt -s dotglob nullglob
          mv discord-auth-bot/* .
          rmdir discord-auth-bot

      - name: Delete this workflow
        run: |
          rm -f .github/workflows/unzip-discord-auth-bot.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Extract discord-auth-bot.zip and remove workflow"
          git push